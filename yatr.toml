# yatr - https://github.com/cargopete/yatr
#
# These tasks are what .github/workflows/ci.yml runs, command for command, so
# `yatr ci` locally is the same gate as CI. If you change a command here,
# CI changes with it; the workflow calls these tasks by name.
#
# Task names match the rest of the nuthatch-org org. Note that the aggregate
# is `ci` and the type-check is `typecheck`: `yatr check` is a builtin that
# validates this file and shadows any task of that name without warning.

[env]
CARGO_TERM_COLOR = "always"

[settings]
cache = true

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted (CI: Format)"
run = ["cargo fmt --all -- --check"]
sources = ["**/*.rs", "rustfmt.toml"]

[tasks.lint]
desc = "Clippy with warnings denied (CI: Clippy)"
run = ["cargo clippy --all-targets --all-features -- -D warnings"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Run the test suite (CI: Test)"
run = ["cargo test --all-targets --locked"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]
watch = ["**/*.rs"]

[tasks.typecheck]
desc = "Type-check without building"
run = ["cargo check --all-targets"]
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.build]
desc = "Build in release mode"
run = ["cargo build --release"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.image]
desc = "Build the Docker image (CI: docker build)"
run = ["docker build -t indexer-gateway-auth:ci ."]
no_cache = true

[tasks.ci]
desc = "What CI runs: fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]
run = []
